<html lang="pt">
    <head>
        <link rel="stylesheet" href="CSS/InfoPage.css">
    </head>

    <body>
        <button id="backBtn" class="back-button">← Voltar</button>
        
        <div class="container">
            <h1>Para os Professores</h1>
            
            <div class="info-section">
                <p>
                    Agradecemos aos professores que nos apoiaram e orientaram durante o desenvolvimento deste projeto.
            </div>

            <div class="gallery-section">
                <div class="prof-image-gallery">
                    <!-- Images can be added here -->
                    <div class="gallery-item">
                        <img src="Imagens/EmanuelNunes.png" alt="Emanuel" class="gallery-img" >
                        <p class="gallery-caption">Eng. Emanuel Nunes</p>
                    </div>
                    <div class="gallery-item">
                        <img src="Imagens/luispires.png" alt="Luis" class="gallery-img">
                        <p class="gallery-caption">Eng. Luis Pires</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Image Modal/Lightbox -->
        <div id="imageModal" class="image-modal">
            <span class="modal-close">&times;</span>
            <img id="modalImage" src="" alt="Expanded Image" class="modal-image">
        </div>

        <script src="JS/SobreNos.js"></script>
    </body>
</HTML>
