<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <title>Projeto Lobo - Página Inicial</title>

        <script src="JS/login.js" defer></script>
        <script src="JS/Certificado.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <body>

            </div>
        
            <ul>
                <li><a href="SobreOLobo.html" class="link">Sobre o Lobo</a></li>

                <li><a href="SobreNos.html" class="link">Sobre Nós</a></li>
                <li><a href="SobreProfs.html" class="link">Para os Professores</a></li>

            </ul>
        </div>

        <button id="secretButton" class="secret-btn" title="???"></button>
        <audio id="secretSound" src="Audio/howl.mp3"></audio>
